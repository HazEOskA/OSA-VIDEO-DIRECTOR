<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSA Video Director</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0f;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 48px;
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #888;
      font-size: 18px;
    }

    .card {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #FFD700;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: #0a0a0f;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      padding: 16px;
      color: #ffffff;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #FFD700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .format-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .format-btn {
      flex: 1;
      padding: 12px;
      background: #0a0a0f;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 6px;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }

    .format-btn:hover {
      border-color: #FFD700;
    }

    .format-btn.active {
      background: #FFD700;
      color: #0a0a0f;
      border-color: #FFD700;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="checkbox"], input[type="radio"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      border: none;
      border-radius: 8px;
      color: #0a0a0f;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .job-status {
      margin-top: 30px;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
    }

    .status-CREATED { background: #333; color: #fff; }
    .status-PLANNING { background: #1e3a8a; color: #93c5fd; }
    .status-PREPARING_ASSETS { background: #1e40af; color: #bfdbfe; }
    .status-GENERATING_VOICE { background: #7c3aed; color: #ddd6fe; }
    .status-COMPOSING { background: #059669; color: #6ee7b7; }
    .status-RENDERING { background: #ea580c; color: #fdba74; }
    .status-VERIFYING { background: #0891b2; color: #67e8f9; }
    .status-COMPLETED { background: #16a34a; color: #86efac; }
    .status-FAILED { background: #dc2626; color: #fca5a5; }

    .progress-steps {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
      flex-wrap: wrap;
      gap: 5px;
    }

    .step {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      font-size: 11px;
      text-transform: uppercase;
      color: #666;
      border-bottom: 2px solid #333;
      min-width: 80px;
    }

    .step.active {
      color: #FFD700;
      border-bottom-color: #FFD700;
    }

    .step.completed {
      color: #16a34a;
      border-bottom-color: #16a34a;
    }

    .video-preview {
      margin-top: 20px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    video {
      width: 100%;
      max-height: 500px;
      display: block;
    }

    .error-message {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid #dc2626;
      border-radius: 8px;
      padding: 16px;
      color: #fca5a5;
      margin-top: 20px;
    }

    .artifact-info {
      margin-top: 15px;
      padding: 15px;
      background: rgba(22, 163, 74, 0.1);
      border: 1px solid #16a34a;
      border-radius: 8px;
      font-size: 14px;
    }

    .artifact-info p {
      margin: 5px 0;
    }

    .demo-btn {
      margin-top: 10px;
      padding: 10px 20px;
      background: transparent;
      border: 1px solid #FFD700;
      border-radius: 6px;
      color: #FFD700;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .demo-btn:hover {
      background: rgba(255, 215, 0, 0.1);
    }

    @media (max-width: 600px) {
      h1 { font-size: 32px; }
      .format-selector { flex-direction: column; }
      .progress-steps { flex-direction: column; gap: 10px; }
      .step { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>OSA VIDEO DIRECTOR</h1>
      <p class="subtitle">Turn prompts into cinematic reels with OSA</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="prompt">Video Request Prompt</label>
        <textarea 
          id="prompt" 
          placeholder='Example: "Create a 30-second cinematic reel about Truman Show AI. English male narration. Captions enabled. 9:16."'
        >Create a cinematic technology presentation about Truman Show AI. Explain that it is a persistent artificial civilisation with approximately fifty thousand residents, subjective agent knowledge, memory, companies, markets, institutions, deterministic history and replay. End with: Claim is not proof. Proof must be replayable.</textarea>
      </div>

      <div class="form-group">
        <label>Format</label>
        <div class="format-selector">
          <button class="format-btn" data-format="9:16">9:16 Vertical</button>
          <button class="format-btn active" data-format="16:9">16:9 Horizontal</button>
          <button class="format-btn" data-format="1:1">1:1 Square</button>
        </div>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="voice-enabled">
          <label for="voice-enabled" style="margin: 0; text-transform: none;">Voice Narration Enabled</label>
        </div>
      </div>

      <div class="form-group">
        <label>Captions</label>
        <div class="checkbox-group">
          <input type="radio" name="captions" value="off" checked>
          <span>Off</span>
          <input type="radio" name="captions" value="normal" style="margin-left: 15px;">
          <span>Normal</span>
          <input type="radio" name="captions" value="cinematic" style="margin-left: 15px;">
          <span>Cinematic</span>
        </div>
      </div>

      <button class="btn-primary" id="generate-btn">Generate Video</button>
      <button class="demo-btn" id="demo-btn">Run Demo Request</button>
    </div>

    <div class="card job-status" id="job-status" style="display: none;">
      <h2 style="color: #FFD700; margin-bottom: 15px;">Job Status</h2>
      
      <div class="progress-steps">
        <div class="step" data-step="CREATED">Created</div>
        <div class="step" data-step="PLANNING">Planning</div>
        <div class="step" data-step="PREPARING_ASSETS">Assets</div>
        <div class="step" data-step="GENERATING_VOICE">Voice</div>
        <div class="step" data-step="COMPOSING">Composing</div>
        <div class="step" data-step="RENDERING">Rendering</div>
        <div class="step" data-step="VERIFYING">Verifying</div>
        <div class="step" data-step="COMPLETED">Completed</div>
      </div>

      <div style="text-align: center; margin: 20px 0;">
        <span class="status-badge" id="status-badge">CREATED</span>
      </div>

      <div id="error-container"></div>
      <div id="video-container"></div>
      <div id="artifact-container"></div>
    </div>
  </div>

  <script>
    let selectedFormat = '16:9';
    let currentJobId = null;
    let pollInterval = null;

    // Format selector
    document.querySelectorAll('.format-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedFormat = btn.dataset.format;
      });
    });

    // Generate button
    document.getElementById('generate-btn').addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) {
        alert('Please enter a prompt');
        return;
      }

      const voiceEnabled = document.getElementById('voice-enabled').checked;
      const captions = document.querySelector('input[name="captions"]:checked').value;

      await createJob(prompt, selectedFormat, voiceEnabled, captions);
    });

    // Demo button
    document.getElementById('demo-btn').addEventListener('click', async () => {
      await runDemo();
    });

    async function createJob(prompt, format, voiceEnabled, captions) {
      try {
        const response = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt,
            format,
            voice: { enabled: voiceEnabled },
            captions,
            durationTarget: 30,
            language: 'en'
          })
        });

        const result = await response.json();
        
        if (response.ok) {
          currentJobId = result.jobId;
          showJobStatus();
          startPolling(currentJobId);
        } else {
          showError(result.error);
        }
      } catch (error) {
        showError(error.message);
      }
    }

    async function runDemo() {
      try {
        document.getElementById('job-status').style.display = 'block';
        updateSteps('CREATED');
        
        const response = await fetch('/api/demo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const result = await response.json();
        
        if (result.success) {
          currentJobId = result.job.id;
          updateJobDisplay(result.job);
          
          if (result.job.status === 'COMPLETED' || result.job.status === 'FAILED') {
            stopPolling();
          } else {
            startPolling(currentJobId);
          }
        } else {
          showError(result.error);
        }
      } catch (error) {
        showError(error.message);
      }
    }

    function startPolling(jobId) {
      if (pollInterval) clearInterval(pollInterval);
      
      pollInterval = setInterval(async () => {
        try {
          const response = await fetch(`/api/jobs/${jobId}`);
          const job = await response.json();
          updateJobDisplay(job);
          
          if (job.status === 'COMPLETED' || job.status === 'FAILED') {
            stopPolling();
          }
        } catch (error) {
          console.error('Polling error:', error);
        }
      }, 2000);
    }

    function stopPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }

    function updateJobDisplay(job) {
      document.getElementById('job-status').style.display = 'block';
      updateSteps(job.status);
      
      const statusBadge = document.getElementById('status-badge');
      statusBadge.textContent = job.status;
      statusBadge.className = `status-badge status-${job.status}`;

      if (job.error) {
        showError(job.error);
      }

      if (job.status === 'COMPLETED' && job.artifacts && job.artifacts.length > 0) {
        showVideoPreview(job);
      }
    }

    function updateSteps(currentStatus) {
      const steps = ['CREATED', 'PLANNING', 'PREPARING_ASSETS', 'GENERATING_VOICE', 'COMPOSING', 'RENDERING', 'VERIFYING', 'COMPLETED'];
      const currentIndex = steps.indexOf(currentStatus);
      
      document.querySelectorAll('.step').forEach(step => {
        const stepName = step.dataset.step;
        const stepIndex = steps.indexOf(stepName);
        
        step.classList.remove('active', 'completed');
        
        if (stepIndex < currentIndex) {
          step.classList.add('completed');
        } else if (stepIndex === currentIndex) {
          step.classList.add('active');
        }
      });
    }

    function showJobStatus() {
      document.getElementById('job-status').style.display = 'block';
      document.getElementById('error-container').innerHTML = '';
      document.getElementById('video-container').innerHTML = '';
      document.getElementById('artifact-container').innerHTML = '';
    }

    function showError(message) {
      const container = document.getElementById('error-container');
      container.innerHTML = `<div class="error-message"><strong>Error:</strong> ${message}</div>`;
    }

    function showVideoPreview(job) {
      const container = document.getElementById('video-container');
      const artifactPath = job.artifacts[0];
      
      container.innerHTML = `
        <div class="video-preview">
          <video controls>
            <source src="${artifactPath}" type="video/mp4">
            Your browser does not support video playback.
          </video>
        </div>
      `;

      // Show artifact info
      const artifactContainer = document.getElementById('artifact-container');
      const v = job.verification;
      artifactContainer.innerHTML = `
        <div class="artifact-info">
          <p><strong>Artifact:</strong> ${artifactPath}</p>
          <p><strong>Resolution:</strong> ${v?.actualResolution || 'N/A'}</p>
          <p><strong>Duration:</strong> ${(v?.actualDuration || 0).toFixed(2)}s</p>
          <p><strong>Codec:</strong> ${v?.videoCodec || 'N/A'}</p>
          <p><strong>File Size:</strong> ${formatFileSize(v?.fileSize)}</p>
          <p><strong>Verification:</strong> ${v?.passed ? '✅ PASSED' : '❌ FAILED'}</p>
        </div>
      `;
    }

    function formatFileSize(bytes) {
      if (!bytes) return 'N/A';
      const mb = bytes / (1024 * 1024);
      return `${mb.toFixed(2)} MB`;
    }
  </script>
</body>
</html>
